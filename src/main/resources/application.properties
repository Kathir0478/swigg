# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000
spring.redis.database=0
# Redis Connection Pool
spring.redis.jedis.pool.max-active=128
spring.redis.jedis.pool.max-idle=128
spring.redis.jedis.pool.min-idle=16
spring.redis.jedis.pool.max-wait=-1ms
spring.redis.jedis.pool.time-between-eviction-runs=30000
spring.redis.jedis.pool.min-evictable-idle-time=60000
spring.redis.jedis.pool.num-tests-per-eviction-run=3
# Cache TTL values (in seconds)
cache.default-ttl=${CACHE_DEFAULT_TTL:3600}
cache.geocoding-ttl=${CACHE_GEOCODING_TTL:3600}
cache.otp-ttl=${CACHE_OTP_TTL:300}


# TOTP Configuration
# Window size for TOTP verification (in time steps, each step = 30 seconds)
# totp.window=10 means 10 steps = ~5 minutes validity window
totp.window=10
totp.time-step=30
totp.length=6
totp.secret-length=32
totp.algorithm=HmacSHA1

# Async Configuration
async.core-pool-size=5
async.max-pool-size=10
async.queue-capacity=100
async.thread-name-prefix=async-otp-

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Exchange and Queue Names
rabbitmq.rider.notification.exchange=${RABBITMQ_RIDER_NOTIFICATION_EXCHANGE:rider.notification.exchange}
rabbitmq.rider.notification.queue=${RABBITMQ_RIDER_NOTIFICATION_QUEUE:rider.notification.queue}
rabbitmq.location.tracking.exchange=${RABBITMQ_LOCATION_TRACKING_EXCHANGE:location.tracking.exchange}
rabbitmq.location.tracking.queue=${RABBITMQ_LOCATION_TRACKING_QUEUE:location.tracking.queue}
rabbitmq.order.status.exchange=${RABBITMQ_ORDER_STATUS_EXCHANGE:order.status.exchange}
rabbitmq.order.status.queue=${RABBITMQ_ORDER_STATUS_QUEUE:order.status.queue}

# Rider Notification Configuration
rider.notification.search.radius.km=${RIDER_NOTIFICATION_SEARCH_RADIUS_KM:5.0}
rider.notification.timeout.minutes=${RIDER_NOTIFICATION_TIMEOUT_MINUTES:10}

# Delivery OTP Configuration
delivery.otp.length=${DELIVERY_OTP_LENGTH:6}
